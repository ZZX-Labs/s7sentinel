name: S7Sentinel Defensive Analysis
description: Run offline/read-only S7Sentinel PLC posture or defensive telemetry analysis in GitHub Actions.
author: S7Sentinel contributors

branding:
  icon: shield
  color: green

inputs:
  mode:
    description: "Analysis mode: inventory, s7log, agentlog, hostcheck, or agentcheck."
    required: false
    default: inventory
  source:
    description: Repository-relative CSV path or comma-separated repository-relative roots, depending on mode.
    required: true
  output-dir:
    description: Repository-relative directory for generated reports.
    required: false
    default: s7sentinel-results
  python-version:
    description: Python version used to run S7Sentinel.
    required: false
    default: "3.12"
  fail-on-findings:
    description: Fail the workflow when S7Sentinel returns review-required exit code 1.
    required: false
    default: "false"
  hash-matches:
    description: Compute SHA-256 hashes for hostcheck/agentcheck matches.
    required: false
    default: "false"
  maintenance-start:
    description: Optional HH:MM start of the approved maintenance window for s7log.
    required: false
    default: ""
  maintenance-end:
    description: Optional HH:MM end of the approved maintenance window for s7log.
    required: false
    default: ""
  upload-artifact:
    description: Upload the generated report directory as a GitHub Actions artifact.
    required: false
    default: "true"
  artifact-name:
    description: Name of the uploaded GitHub Actions artifact.
    required: false
    default: s7sentinel-analysis

outputs:
  report-json:
    description: Repository-relative path to the JSON report.
    value: ${{ steps.analyze.outputs['report-json'] }}
  report-html:
    description: Repository-relative path to the HTML report when inventory mode is used.
    value: ${{ steps.analyze.outputs['report-html'] }}
  exit-code:
    description: Native S7Sentinel exit code before fail-on-findings policy is applied.
    value: ${{ steps.analyze.outputs['exit-code'] }}
  result:
    description: clean, findings, or error.
    value: ${{ steps.analyze.outputs.result }}
  finding-count:
    description: Aggregate finding/review-artifact count.
    value: ${{ steps.analyze.outputs['finding-count'] }}
  high-count:
    description: Aggregate HIGH-severity finding count.
    value: ${{ steps.analyze.outputs['high-count'] }}
  critical-count:
    description: Aggregate CRITICAL-severity finding count.
    value: ${{ steps.analyze.outputs['critical-count'] }}
  max-severity:
    description: Highest aggregate severity observed.
    value: ${{ steps.analyze.outputs['max-severity'] }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs['python-version'] }}

    - name: Install S7Sentinel action package
      shell: bash
      run: python -m pip install --disable-pip-version-check "$GITHUB_ACTION_PATH"

    - name: Run defensive analysis
      id: analyze
      shell: bash
      env:
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_OUTPUT_DIR: ${{ inputs['output-dir'] }}
        INPUT_FAIL_ON_FINDINGS: ${{ inputs['fail-on-findings'] }}
        INPUT_HASH_MATCHES: ${{ inputs['hash-matches'] }}
        INPUT_MAINTENANCE_START: ${{ inputs['maintenance-start'] }}
        INPUT_MAINTENANCE_END: ${{ inputs['maintenance-end'] }}
      run: python "$GITHUB_ACTION_PATH/scripts/github_action.py"

    - name: Upload S7Sentinel reports
      if: ${{ always() && inputs['upload-artifact'] == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs['artifact-name'] }}
        path: ${{ inputs['output-dir'] }}
        if-no-files-found: warn
        retention-days: 14
