name: S7Sentinel Analysis

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Defensive analysis mode
        required: true
        default: inventory
        type: choice
        options:
          - inventory
          - s7log
          - agentlog
          - hostcheck
          - agentcheck
      source:
        description: Repository-relative CSV path or comma-separated roots
        required: true
        default: examples/inventory.csv
        type: string
      fail_on_findings:
        description: Mark the workflow failed when review-required findings are detected
        required: true
        default: false
        type: boolean
      hash_matches:
        description: SHA-256 matching files in hostcheck/agentcheck modes
        required: true
        default: false
        type: boolean
      maintenance_start:
        description: Optional HH:MM maintenance-window start for s7log
        required: false
        default: ""
        type: string
      maintenance_end:
        description: Optional HH:MM maintenance-window end for s7log
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  analyze:
    name: ${{ inputs.mode }} analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run S7Sentinel
        id: s7sentinel
        uses: ./
        with:
          mode: ${{ inputs.mode }}
          source: ${{ inputs.source }}
          fail-on-findings: ${{ inputs.fail_on_findings }}
          hash-matches: ${{ inputs.hash_matches }}
          maintenance-start: ${{ inputs.maintenance_start }}
          maintenance-end: ${{ inputs.maintenance_end }}
          artifact-name: s7sentinel-${{ inputs.mode }}-${{ github.run_number }}

      - name: Publish concise result
        if: always()
        shell: bash
        run: |
          printf '%s\n' "Result: ${{ steps.s7sentinel.outputs.result }}"
          printf '%s\n' "Findings: ${{ steps.s7sentinel.outputs['finding-count'] }}"
          printf '%s\n' "HIGH: ${{ steps.s7sentinel.outputs['high-count'] }}"
          printf '%s\n' "CRITICAL: ${{ steps.s7sentinel.outputs['critical-count'] }}"
          printf '%s\n' "JSON: ${{ steps.s7sentinel.outputs['report-json'] }}"
