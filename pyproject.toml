[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s7sentinel"
version = "0.3.0"
description = "Defensive Siemens S7/OT and agentic-intrusion posture, artifact, and telemetry analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "S7Sentinel contributors"}]
keywords = [
  "ics", "ot", "plc", "siemens-s7", "s7comm", "cybersecurity",
  "threat-detection", "incident-response", "ai-security", "defensive-security"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Monitoring"
]
dependencies = []

[project.scripts]
s7sentinel = "s7sentinel.cli:main"

[tool.setuptools]
packages = ["s7sentinel"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
